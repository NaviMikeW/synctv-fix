version: '3.3'
services:
  synctv:
    image: 'ghcr.io/navimikew/synctv-fix:latest'
    container_name: synctv
    restart: unless-stopped
    ports:
      - '8080:8080/tcp'
      - '8080:8080/udp'
    volumes:
      - /opt/synctv:/root/.synctv
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
      - TZ=Asia/Shanghai
      # Generate once with: openssl rand -hex 32
      # Keep the same value across container upgrades and database restores.
      - SYNCTV_GUARDIAN_CREDENTIAL_KEY=${SYNCTV_GUARDIAN_CREDENTIAL_KEY:?Generate it once with openssl rand -hex 32 and keep it safe}
      # Keep true. If HTTPS ends at a trusted reverse proxy such as Lucky,
      # set TRUST_FORWARDED_PROTO=true and do not expose port 8080 publicly.
      - SYNCTV_GUARDIAN_REQUIRE_HTTPS=true
      - SYNCTV_GUARDIAN_TRUST_FORWARDED_PROTO=${SYNCTV_GUARDIAN_TRUST_FORWARDED_PROTO:-false}

{{- $databasePassword := required "postgresql.password is required; provide a strong password through a protected values file or --set-string" .Values.postgresql.password -}}
{{- $guardianCredentialKey := required "synctv.security.guardianCredentialKey is required; generate one with openssl rand -hex 32 and keep it stable" .Values.synctv.security.guardianCredentialKey -}}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" $guardianCredentialKey) -}}
{{- fail "synctv.security.guardianCredentialKey must be exactly 64 hexadecimal characters" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: synctv-secrets
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ $databasePassword | quote }}
  SYNCTV_GUARDIAN_CREDENTIAL_KEY: {{ $guardianCredentialKey | quote }}

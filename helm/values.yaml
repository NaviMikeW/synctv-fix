# Default values for synctv.
synctv:
  image:
    repository: ghcr.io/navimikew/synctv-fix
    # Required at install time. Use an immutable sha-* tag that you have
    # validated; mutable latest is intentionally not a Helm default.
    tag: ""
    pullPolicy: IfNotPresent
  envConfigName: synctv-env
  storage:
    size: 1Gi
    storageClass: ""

postgresql:
  enabled: true
  replicaCount: 1
  service:
    port: 5432
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  # Required at install time. Store the real value outside values files and
  # pass it with --set-string or a protected values file.
  password: ""
  storage:
    size: 1Gi
    storageClass: ""

ingress:
  enabled: true
  className: nginx
  annotations: {}
